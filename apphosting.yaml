runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: OPENAI_MODEL
    value: gpt-4.1-mini
    availability:
      - RUNTIME
  - variable: OPENAI_TEMPERATURE
    value: "0.2"
    availability:
      - RUNTIME
  - variable: REQUEST_BODY_LIMIT
    value: 1mb
    availability:
      - RUNTIME
  - variable: REQUIRE_FIREBASE_AUTH
    value: "true"
    availability:
      - RUNTIME
  - variable: CORS_ORIGINS
    value: ""
    availability:
      - RUNTIME
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME

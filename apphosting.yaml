runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production

  - variable: AI_PROVIDER
    value: openai

  - variable: REQUIRE_FIREBASE_AUTH
    value: "true"

  - variable: REQUEST_BODY_LIMIT
    value: "10mb"

  - variable: CORS_ORIGINS
    value: "https://gerenciadormobile.web.app,https://gerenciadormobile.firebaseapp.com,https://appmobileprod-19505.web.app,http://localhost:5173,http://127.0.0.1:5173"

  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY

  - variable: OPENAI_MODEL
    value: "gpt-4.1-mini"

  - variable: OPENAI_TEMPERATURE
    value: "0.2"

  - variable: GROQ_MODEL
    value: "qwen/qwen3.6-27b"

  - variable: GROQ_TEMPERATURE
    value: "0.2"

  # Tela Instalacoes do Admin ("Atualizar agora"): mesmos parametros nao secretos da rotina
  # instalacoesAppNightly. A chave da Apple fica no Secret Manager (APPLE_RELATORIOS_LEITURA_P8).
  - variable: INSTALACOES_CONTA_DE_SERVICO
    value: "relatorios-lojas@appmobileprod-19505.iam.gserviceaccount.com"

  - variable: PLAY_REPORTS_BUCKET
    value: "pubsite_prod_8207483442033797961"

  - variable: APPLE_ISSUER_ID
    value: "ee6e5714-dd2e-4704-9958-3d3377837045"

  - variable: APPLE_KEY_ID
    value: "G38M6BUN37"
